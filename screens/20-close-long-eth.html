<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>平多 ETH</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .status{position:relative;padding:14px 32px 0;height:55px;font-size:16px}
    .status:before{content:"";position:absolute;width:153px;height:39px;border-radius:22px;background:#000;top:13px;left:50%;transform:translateX(-50%)}
    .status:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#f23346;top:27px;left:128px}
    .nav{display:flex;align-items:center;gap:14px;padding:11px 16px 0}
    .nav .title{font-size:15px;font-weight:700}
    .pxline{padding:0 16px 0 47px;font-size:13px;color:var(--text-2)}
    .pxline b{color:#000;font-weight:600;margin-right:6px}
    .scroll{overflow:hidden;display:flex;flex-direction:column}
    .amt-box{margin:40px 16px 29px;text-align:center}
    .amt-box .usd{font-size:32px;font-weight:700;letter-spacing:-0.5px}
    .amt-box .sub{font-size:13px;color:var(--text-2);margin-top:7px}
    .slider-track{margin:0 40px 1px;height:25px}
    .slider-track .fill{width:100%}
    .slider-track .thumb{left:100%;transform:translate(-50%,-50%);width:12px;height:12px;border:2px solid #222}
    .slider-track .marks i{width:6px;height:6px;background:#222}
    .slider-labels{display:flex;justify-content:space-between;padding:0 33px 18px;font-size:11px;color:var(--text-2)}
    .params{padding:0 16px}
    .param{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px}
    .param .k{color:var(--text-2)}
    .param .k.dot{border-bottom:1px dotted #c7c7cc;padding-bottom:1px}
    .param .v{font-weight:500;display:flex;align-items:center;gap:4px}
    .param .v .chev{color:var(--text-3)}
    .cta-wrap{margin-top:auto;padding:14px 16px 10px}
    .cta-wrap button{width:100%;height:48px;border-radius:24px;background:#000;color:#fff;font-size:16px;font-weight:600}
    .keypad{height:210px;background:#fff;padding:0 8px 18px;flex-shrink:0;display:grid;grid-template-columns:repeat(3,1fr)}
    .keypad .key{height:48px;margin:0;background:#fff;box-shadow:none;border-radius:0;font-size:24px;display:flex;align-items:center;justify-content:center}
    .keypad .key.del{font-size:0}.keypad .key.del:after{content:"⌫";font-size:20px}
  </style>
</head>
<body class="capture">
<div class="phone" id="screen">
  <div class="status">
    <span>15:35</span>
    <div class="right">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#000"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="#000"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.2 0 4.2.8 5.8 2.2l-1.2 1.2A6.6 6.6 0 008 4.2c-1.7 0-3.3.6-4.5 1.7L2.3 4.6A8.4 8.4 0 018 2.2zm0 3.2c1.4 0 2.7.5 3.7 1.4L10.5 8A3.7 3.7 0 008 7c-.9 0-1.8.3-2.5.9L4.3 6.7A5.5 5.5 0 018 5.4zm0 3.2c.6 0 1.1.2 1.5.6L8 11.7 6.5 9.2c.4-.4.9-.6 1.5-.6z" fill="#000"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="1" width="21" height="10" rx="2.5" stroke="#000" stroke-width="1" fill="none"/><rect x="2" y="2.5" width="17" height="7" rx="1.2" fill="#000"/><rect x="22.5" y="3.5" width="2" height="5" rx="0.8" fill="#000"/></svg>
    </div>
  </div>
  <div class="screen-body">
    <div class="nav">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><path d="M15 19l-7-7 7-7"/></svg>
      <div class="title">平多 ETH</div>
    </div>
    <div class="pxline"><b>1,903.8</b><span class="red">-0.20%</span></div>
    <div class="scroll">
      <div class="amt-box">
        <div class="usd">10.47 USDC</div>
        <div class="sub">0.0055 ETH</div>
      </div>
      <div class="slider-track">
        <div class="rail"></div>
        <div class="fill"></div>
        <div class="marks"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="thumb"></div>
      </div>
      <div class="slider-labels">
        <span>0%</span><span>50%</span><span>100%</span>
      </div>
      <div class="params">
        <div class="param"><span class="k">預估盈虧</span><span class="v red">&gt;-0.01 USDC</span></div>
        <div class="param"><span class="k">保證金</span><span class="v">1.02 USDC</span></div>
        <div class="param"><span class="k">滑點</span><span class="v">1% <span class="chev">›</span></span></div>
        <div class="param"><span class="k dot">交易手續費</span><span class="v">&lt;0.01 USDC</span></div>
      </div>
      <div class="cta-wrap">
        <button>平多</button>
      </div>
    </div>
    <div class="keypad">
      <div class="key">1</div><div class="key">2</div><div class="key">3</div>
      <div class="key">4</div><div class="key">5</div><div class="key">6</div>
      <div class="key">7</div><div class="key">8</div><div class="key">9</div>
      <div class="key">.</div><div class="key">0</div><div class="key del">⌫</div>
    </div>
  </div>
</div>
</body>
</html>
