    .price-head .stats {
      text-align:right;font-size:9px;color:#aaa;line-height:1.85;padding-top:0;
    }
    .price-head .stats b { color: #000; font-weight: 500; margin-left: 10px; }
    .tf {
      height:35px;display:flex;justify-content:space-between;padding:5px 20px 7px;font-size:11px;color:#999;align-items:center;
    }
    .tf .on {
      color:#000;font-weight:600;position:relative;
    }
    .tf .on::after {
      content:none;
    }
    .tf .gear{display:none}
    .chart-wrap{position:relative;height:200px;margin:0}
    .chart-wrap svg { width: 100%; height: 100%; }
    .yaxis {
      position:absolute;right:4px;top:0;bottom:0;
      display: flex; flex-direction: column; justify-content: space-between;
      font-size: 10px; color: var(--text-2); padding: 4px 0 20px; pointer-events: none;
    }
    .tag {
      position:absolute;right:4px;top:42%;background:#f3f3f3;color:#555;font-size:9px;padding:1px 3px;border:1px solid #999;border-radius:1px;
    }
    .times {
      display: flex; justify-content: space-between;
      height:18px;padding:2px 9px;font-size:9px;color:#999;
    }
    .macd-bars {
      height:32px;margin:0 8px 2px;
      display: flex; align-items: center; gap: 2px;
    }
    .macd-bars i { flex: 1; display: block; border-radius: 1px; }
    .data-sec{padding:13px 15px 8px}.data-sec h3{font-size:14px;font-weight:700;margin-bottom:8px}
    .data-sec .row {
      display: flex; justify-content: space-between;
      font-size:13px;padding:6px 0;
    }
    .data-sec .row .k { color: var(--text-2); }
    .data-sec .row .v { font-weight: 500; }
    .cta-row {
      display: flex; gap: 12px;
      height:63px;padding:9px 14px 17px;border-top:none;
      background: #fff; flex-shrink: 0;
    }
    .cta-row button {
      flex:1;height:36px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;
    }
    .cta-row .long { background: var(--green); }
    .cta-row .short { background: var(--red-cta); }
  </style>
