  <style>
    .nav {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 12px 6px;
    }
    .nav .back { width: 28px; height: 28px; display: flex; align-items: center; }
    .nav .pair {
      display: flex; align-items: center; gap: 6px;
      font-size: 16px; font-weight: 700;
    }
    .nav .chg { font-size: 12px; margin-top: 1px; margin-left: 38px; }
    .price-head {
      display: flex; justify-content: space-between;
      padding: 4px 16px 10px;
    }
    .price-head .big {
      font-size: 36px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.1;
    }
    .price-head .chg { font-size: 14px; margin-top: 4px; font-weight: 500; }
    .price-head .stats {
      text-align: right; font-size: 11px; color: var(--text-2); line-height: 1.7;
      padding-top: 4px;
    }
    .price-head .stats b { color: #000; font-weight: 500; margin-left: 10px; }
    .tf {
      display: flex; gap: 12px; padding: 2px 16px 8px;
      font-size: 13px; color: var(--text-2); align-items: center;
    }
    .tf .on {
      color: #000; font-weight: 700; position: relative; padding-bottom: 4px;
    }
    .tf .on::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0;
      height: 2px; background: #000; border-radius: 1px;
    }
    .tf .gear { margin-left: auto; opacity: .55; }
    .chart-wrap { position: relative; height: 200px; margin: 0 8px; }
    .chart-wrap svg { width: 100%; height: 100%; }
    .yaxis {
      position: absolute; right: 4px; top: 0; bottom: 0;
      display: flex; flex-direction: column; justify-content: space-between;
      font-size: 10px; color: var(--text-2); padding: 4px 0 20px; pointer-events: none;
    }
    .tag {
      position: absolute; right: 48px; top: 42%;
      background: #8e8e93; color: #fff; font-size: 10px;
      padding: 1px 5px; border-radius: 2px;
    }
    .times {
      display: flex; justify-content: space-between;
      padding: 2px 12px 4px; font-size: 10px; color: var(--text-2);
    }
    .macd-bars {
      height: 36px; margin: 2px 12px 4px;
      display: flex; align-items: center; gap: 2px;
    }
    .macd-bars i { flex: 1; display: block; border-radius: 1px; }
    .data-sec { padding: 10px 16px 8px; }
    .data-sec h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .data-sec .row {
      display: flex; justify-content: space-between;
      font-size: 13px; padding: 7px 0;
    }
    .data-sec .row .k { color: var(--text-2); }
    .data-sec .row .v { font-weight: 500; }
    .cta-row {
      display: flex; gap: 12px;
      padding: 10px 16px calc(10px + var(--safe-b));
      border-top: 0.5px solid var(--border-light);
      background: #fff; flex-shrink: 0;
    }
    .cta-row button {
      flex: 1; height: 48px; border-radius: 12px;
      font-size: 16px; font-weight: 600; color: #fff;
    }
    .cta-row .long { background: var(--green); }
    .cta-row .short { background: var(--red-cta); }
  </style>
</head>
