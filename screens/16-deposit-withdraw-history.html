<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>历史纪录 · 充提记录</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .nav {
      display: flex; align-items: center; justify-content: center;
      padding: 4px 12px 10px; position: relative;
    }
    .nav .back { position: absolute; left: 12px; top: 6px; }
    .nav .title { font-size: 17px; font-weight: 700; }
    .tabs {
      display: flex; gap: 18px; padding: 0 16px;
      font-size: 14px; color: var(--text-2);
      border-bottom: 0.5px solid var(--border);
      overflow-x: auto; white-space: nowrap;
    }
    .tabs .on {
      color: #000; font-weight: 700; padding-bottom: 10px;
      border-bottom: 2.5px solid #000; margin-bottom: -0.5px;
    }
    .tabs span { padding-bottom: 10px; }
    .group { padding-top: 14px; }
    .group .date {
      font-size: 12px; color: var(--text-2);
      padding: 0 16px 8px;
    }
    .hrow {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
    }
    .hrow .mid { flex: 1; font-size: 15px; font-weight: 500; }
    .hrow .amt { font-size: 15px; font-weight: 600; }
  </style>
</head>
<body class="capture">
<div class="phone" id="screen">
  <div class="status">
    <span>10:05</span>
    <div class="right">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#000"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="#000"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.2 0 4.2.8 5.8 2.2l-1.2 1.2A6.6 6.6 0 008 4.2c-1.7 0-3.3.6-4.5 1.7L2.3 4.6A8.4 8.4 0 018 2.2zm0 3.2c1.4 0 2.7.5 3.7 1.4L10.5 8A3.7 3.7 0 008 7c-.9 0-1.8.3-2.5.9L4.3 6.7A5.5 5.5 0 018 5.4zm0 3.2c.6 0 1.1.2 1.5.6L8 11.7 6.5 9.2c.4-.4.9-.6 1.5-.6z" fill="#000"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="1" width="21" height="10" rx="2.5" stroke="#000" stroke-width="1" fill="none"/><rect x="2" y="2.5" width="17" height="7" rx="1.2" fill="#000"/><rect x="22.5" y="3.5" width="2" height="5" rx="0.8" fill="#000"/></svg>
    </div>
  </div>
  <div class="screen-body">
    <div class="nav">
      <div class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><path d="M15 19l-7-7 7-7"/></svg></div>
      <div class="title">历史纪录</div>
    </div>
    <div class="tabs">
      <span>交易明细</span>
      <span>持仓资金变更</span>
      <span class="on">充提记录</span>
    </div>
    <div class="scroll">
      <div class="group">
        <div class="date">2024/02/10</div>
        <div class="hrow">
          <div class="coin usdc" style="width:36px;height:36px;font-size:12px">$</div>
          <div class="mid">充值 USDC</div>
          <div class="amt green">+10</div>
        </div>
      </div>
      <div class="group">
        <div class="date">2024/02/09</div>
        <div class="hrow">
          <div class="coin usdc" style="width:36px;height:36px;font-size:12px">$</div>
          <div class="mid">提现 USDC</div>
          <div class="amt red">-9</div>
        </div>
      </div>
      <div class="group">
        <div class="date">2024/02/08</div>
        <div class="hrow">
          <div class="coin usdc" style="width:36px;height:36px;font-size:12px">$</div>
          <div class="mid">充值 USDC</div>
          <div class="amt green">+10</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
