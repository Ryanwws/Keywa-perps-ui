<!DOCTYPE html>

  <title>历史记录 · 资金费用</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .nav {
      display: flex; align-items: center; justify-content: center;
      padding: 4px 12px 10px; position: relative;
    }
    .nav .back { position: absolute; left: 12px; top: 6px; }
    .nav .title { font-size: 17px; font-weight: 700; }
    .tabs {
      display: flex; gap: 18px; padding: 0 16px;
      font-size: 14px; color: var(--text-2);
      border-bottom: 0.5px solid var(--border);
      overflow-x: auto; white-space: nowrap;
    }
    .tabs .on {
      color: #000; font-weight: 700; padding-bottom: 10px;
      border-bottom: 2.5px solid #000; margin-bottom: -0.5px;
    }
    .tabs span { padding-bottom: 10px; }
    .hrow {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      border-bottom: 0.5px solid var(--border-light);
    }
    .hrow .mid { flex: 1; min-width: 0; }
    .hrow .name { font-size: 15px; font-weight: 600; }
    .hrow .sub { font-size: 12px; color: var(--text-2); margin-top: 3px; }
    .hrow .amt { font-size: 14px; font-weight: 600; white-space: nowrap; }
  </style>
</head>
