<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>錢包 · 永續 Tab</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 16px 8px;
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg,#00c28a,#0a8f6a);
      display: flex; align-items: center; justify-content: center;
    }
    .web3-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 14px; border-radius: 999px;
      background: var(--bg-muted); font-size: 14px; font-weight: 600;
    }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .bell { position: relative; }
    .bell .dot {
      position: absolute; top: -2px; right: -4px;
      min-width: 14px; height: 14px; border-radius: 7px;
      background: var(--red); color: #fff; font-size: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; padding: 0 3px;
    }
    .search {
      margin: 0 16px 12px; height: 36px; border-radius: 10px;
      background: var(--bg-muted); display: flex; align-items: center;
      gap: 8px; padding: 0 12px; color: var(--text-2); font-size: 14px;
    }
    .wallet-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px 4px;
    }
    .wallet-name {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; color: var(--text-2);
    }
    .bal-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px 14px; gap: 12px;
    }
    .bal { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; flex: 1; min-width: 0; }
    .recv {
      flex-shrink: 0;
      height: 36px; padding: 0 18px; border-radius: 999px;
      background: #000; color: #fff; font-size: 14px; font-weight: 500;
    }
    .actions {
      display: flex; justify-content: space-around;
      padding: 4px 12px 14px;
    }
    .actions .item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text);
    }
    .actions .circ {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--bg-muted);
      display: flex; align-items: center; justify-content: center;
    }
    .banner {
      margin: 0 16px 14px; height: 72px; border-radius: 12px;
      background: linear-gradient(90deg,#eef2ff,#f5f5f5);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; overflow: hidden;
    }
    .banner .t1 { font-size: 14px; font-weight: 600; }
    .banner .t2 { font-size: 12px; color: var(--text-2); margin-top: 4px; }
    .banner .art {
      width: 56px; height: 56px; border-radius: 12px;
      background: linear-gradient(145deg,#4a7cff,#9ec0ff);
    }
    .subtabs {
      display: flex; gap: 20px; padding: 4px 16px 10px;
      font-size: 15px; color: var(--text-2);
    }
    .subtabs .on { color: var(--text); font-weight: 700; }
    .equity {
      margin: 0 16px 12px; background: var(--bg-muted);
      border-radius: 12px; padding: 14px 16px;
    }
    .equity .row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; color: var(--text-2);
    }
    .equity .row + .row { margin-top: 10px; }
    .equity .val { color: var(--text); font-weight: 600; font-size: 15px; }
    .sec-title {
      padding: 4px 16px 8px; font-size: 13px; color: var(--text-2);
    }
    .pos {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 16px;
    }
    .pos .mid { flex: 1; min-width: 0; }
    .pos .name { font-size: 15px; font-weight: 600; }
    .pos .sub { font-size: 12px; margin-top: 3px; display: flex; gap: 6px; align-items: center; }
    .pos .sub .sep { color: #d0d0d0; }
    .pos .right { text-align: right; }
    .pos .amt { font-size: 15px; font-weight: 600; }
    .pos .pnl { font-size: 12px; margin-top: 3px; }
    .start-trade {
      margin: 16px auto 20px; width: calc(100% - 64px);
      height: 44px; border-radius: 999px;
      border: 1px solid #e5e5ea; background: #fff;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; font-size: 14px; font-weight: 500; color: var(--text);
    }
  </style>
</head>
<body class="capture">
