<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>減少保證金</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .nav {
      display: flex; align-items: center; justify-content: center;
      padding: 4px 12px 6px; position: relative;
    }
    .nav .back { position: absolute; left: 12px; top: 6px; }
    .nav .title { font-size: 17px; font-weight: 700; }
    .pxline {
      text-align: center; font-size: 13px; color: var(--text-2); padding-bottom: 16px;
    }
    .pxline b { color: #000; font-weight: 600; margin-right: 4px; }
    .amt {
      text-align: center; padding: 24px 16px 10px;
    }
    .amt .big {
      font-size: 36px; font-weight: 700; letter-spacing: -0.5px;
    }
    .liq {
      text-align: center; font-size: 13px; color: var(--text-2);
      padding: 8px 16px 16px;
    }
    .avail {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 16px 14px; font-size: 13px; color: var(--text-2);
    }
    .avail .v { color: #000; font-weight: 500; }
    .cta {
      margin: 10px 16px; height: 48px; border-radius: 999px;
      background: #000; color: #fff; width: calc(100% - 32px);
      font-size: 16px; font-weight: 600;
    }
    .status{position:relative;padding:14px 32px 0;height:55px;font-size:16px}
    .status:before{content:"";position:absolute;width:153px;height:39px;border-radius:22px;background:#000;top:13px;left:50%;transform:translateX(-50%)}
    .status:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#f23346;top:27px;left:128px}
    .nav{justify-content:flex-start;padding:12px 16px 0;gap:16px}.nav .back{position:static}.nav .title{font-size:15px}
    .pxline{text-align:left;padding:0 0 0 49px;font-size:13px}
    .amt{padding:135px 16px 0}.amt .big{font-size:34px}
    .amt .big:after{content:"";display:inline-block;width:1.5px;height:43px;background:#111;vertical-align:-9px;margin-left:-78px}
    .liq{font-size:13px;padding:9px 16px 0}
    .avail{margin-top:auto;border-top:1px solid #f2f2f2;padding:10px 16px 9px;font-size:12px}
    .cta{order:1;margin:0 16px 11px;width:calc(100% - 32px);height:43px;font-size:14px}
    .pct-row{order:2!important;padding:0 16px!important;margin:0 0 13px!important;gap:10px}.pct-row .pct{height:29px;border-radius:7px;font-size:12px}
    .screen-body>div[style="flex:1"]{display:none}
    .keypad{order:3;height:157px;background:#fff;padding:0 16px 8px;flex-shrink:0}
    .keypad .key{height:37px;margin:0;background:#fff;box-shadow:none;border-radius:0;font-size:22px}
    .keypad .key.del{font-size:0}.keypad .key.del:after{content:"⌫";font-size:19px}
  </style>
</head>
<body class="capture">
<div class="phone" id="screen">
  <div class="status">
    <span>10:04</span>
    <div class="right">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#000"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="#000"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.2 0 4.2.8 5.8 2.2l-1.2 1.2A6.6 6.6 0 008 4.2c-1.7 0-3.3.6-4.5 1.7L2.3 4.6A8.4 8.4 0 018 2.2zm0 3.2c1.4 0 2.7.5 3.7 1.4L10.5 8A3.7 3.7 0 008 7c-.9 0-1.8.3-2.5.9L4.3 6.7A5.5 5.5 0 018 5.4zm0 3.2c.6 0 1.1.2 1.5.6L8 11.7 6.5 9.2c.4-.4.9-.6 1.5-.6z" fill="#000"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="1" width="21" height="10" rx="2.5" stroke="#000" stroke-width="1" fill="none"/><rect x="2" y="2.5" width="17" height="7" rx="1.2" fill="#000"/><rect x="22.5" y="3.5" width="2" height="5" rx="0.8" fill="#000"/></svg>
    </div>
  </div>
  <div class="screen-body">
    <div class="nav">
      <div class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><path d="M15 19l-7-7 7-7"/></svg></div>
      <div class="title">減少保證金</div>
    </div>
    <div class="pxline"><b>$64,396</b><span class="red">-0.26%</span></div>
    <div class="amt">
      <div class="big">0.02 USDC</div>
    </div>
    <div class="liq">強平價 71,292 → 71,168</div>
    <div class="avail">
      <span>ⓘ 最大可減少</span>
      <span class="v">0.21 USDC</span>
    </div>
    <div class="pct-row" style="margin-bottom:8px">
      <div class="pct">10%</div>
      <div class="pct">25%</div>
      <div class="pct">50%</div>
      <div class="pct">100%</div>
    </div>
    <div style="flex:1"></div>
    <button class="cta">減少保證金</button>
    <div class="keypad">
      <div class="key">1</div><div class="key">2</div><div class="key">3</div>
      <div class="key">4</div><div class="key">5</div><div class="key">6</div>
      <div class="key">7</div><div class="key">8</div><div class="key">9</div>
      <div class="key">.</div><div class="key">0</div><div class="key del">⌫</div>
    </div>
  </div>
</div>
</body>
</html>
