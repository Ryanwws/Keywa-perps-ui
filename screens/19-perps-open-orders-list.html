<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>永續 · 當前訂單</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .status{height:48px;padding:21px 31px 0;font-size:16px;position:relative}.island{position:absolute;left:116px;top:13px;width:153px;height:33px;border-radius:20px;background:#000}.island:before{content:"";position:absolute;left:11px;top:11px;width:10px;height:10px;border-radius:50%;background:#e92e3b}
    .hdr {
      display: flex; align-items: center; justify-content: space-between;
      height:69px;padding:13px 15px 8px;
    }
    .hdr h1 {
      font-size:20px;font-weight:700;display:flex;align-items:center;gap:5px;
    }
    .hdr h1 .info {
      width: 16px; height: 16px; border-radius: 50%; border: 1.4px solid #8e8e93;
      color: #8e8e93; font-size: 11px; display: flex; align-items: center; justify-content: center;
      font-weight: 600;
    }
    .hdr .acts { display: flex; gap: 14px; align-items: center; }
    .asset-card {
      margin:0 14px 18px;background:#f7f7f7;border-radius:14px;padding:17px 15px 12px;position:relative;
    }
    .asset-card .lbl {
      font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 4px;
    }
    .asset-card .total {
      font-size:25px;font-weight:700;margin:4px 0 2px;letter-spacing:-.4px;
    }
    .asset-card .avail { font-size: 13px; color: var(--text-2); }
    .asset-card .logos {
      position: absolute; top: 16px; right: 16px; width: 40px; height: 40px;
    }
    .asset-card .logos .usdc {
      width: 36px; height: 36px; border-radius: 50%; background: #2775ca;
      color: #fff; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .asset-card .logos .hl {
      position: absolute; right: -2px; bottom: -2px;
      width: 18px; height: 18px; border-radius: 50%; background: #00d1a0;
      border: 2px solid #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; color: #fff; font-weight: 700;
    }
    .asset-btns{display:flex;gap:10px;margin-top:21px}
    .asset-btns button {
      flex:1;height:37px;border-radius:999px;font-size:14px;font-weight:600;
    }
    .asset-btns .w { background: #e8e8ed; color: #000; }
    .asset-btns .a { background: #000; color: #fff; }
    .tabs {
      display:flex;gap:20px;padding:0 15px;font-size:14px;color:#8e8e93;height:42px;
      border-bottom: 0.5px solid var(--border);
    }
    .tabs .on {
      color: #000; font-weight: 700; padding-bottom: 10px;
      border-bottom: 2.5px solid #000; margin-bottom: -0.5px;
    }
    .tabs span { padding-bottom: 10px; }
    .orow {
      display: flex; align-items: flex-start; gap: 10px;
      padding:12px 14px;border-bottom:.5px solid #eee;height:64px;
    }
    .orow .mid { flex: 1; min-width: 0; }
    .orow .name { font-size: 16px; font-weight: 600; }
    .orow .sub {
      font-size: 12px; margin-top: 4px; display: flex; gap: 6px; align-items: center;
    }
    .orow .sub .sep { color: #d0d0d0; }
    .orow .right { text-align: right; }
    .orow .px { font-size: 16px; font-weight: 600; }
    .orow .otype { font-size: 12px; color: var(--text-2); margin-top: 4px; }
    .tabbar{height:72px;padding:6px 0 21px}
  </style>
</head>
