<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>成交詳情</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .status{height:48px;padding:21px 31px 0;font-size:16px;position:relative}.island{position:absolute;left:116px;top:13px;width:153px;height:33px;border-radius:20px;background:#000}.island:before{content:"";position:absolute;left:11px;top:11px;width:10px;height:10px;border-radius:50%;background:#e92e3b}
    .nav{height:48px;display:flex;align-items:center;padding:0 16px}.hero{display:flex;flex-direction:column;align-items:center;padding:7px 16px 14px}.hero .coin{width:28px;height:28px;font-size:14px;margin-bottom:10px}.hero .amt{font-size:25px;font-weight:700;letter-spacing:-.4px}.hero .sub{font-size:14px;margin-top:8px;font-weight:600}.divider{height:.5px;background:#e6e6e6;margin:0 14px 13px}.rows{padding:0 15px}.rows .r{display:flex;justify-content:space-between;align-items:center;height:33px;font-size:13px}.rows .r .k{color:#8e8e93}.rows .r .v{font-weight:500}.explorer{margin:15px 14px 0;height:43px;border-radius:999px;background:#f5f5f5;font-size:14px;font-weight:600;width:calc(100% - 28px)}
  </style>
</head>
<body class="capture">
<div class="phone" id="screen">
  <div class="status">
    <span>10:06</span>
    <div class="island"></div>
    <div class="right">
      <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#000"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="#000"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#000"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.2 0 4.2.8 5.8 2.2l-1.2 1.2A6.6 6.6 0 008 4.2c-1.7 0-3.3.6-4.5 1.7L2.3 4.6A8.4 8.4 0 018 2.2zm0 3.2c1.4 0 2.7.5 3.7 1.4L10.5 8A3.7 3.7 0 008 7c-.9 0-1.8.3-2.5.9L4.3 6.7A5.5 5.5 0 018 5.4zm0 3.2c.6 0 1.1.2 1.5.6L8 11.7 6.5 9.2c.4-.4.9-.6 1.5-.6z" fill="#000"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="1" width="21" height="10" rx="2.5" stroke="#000" stroke-width="1" fill="none"/><rect x="2" y="2.5" width="17" height="7" rx="1.2" fill="#000"/><rect x="22.5" y="3.5" width="2" height="5" rx="0.8" fill="#000"/></svg>
    </div>
  </div>
  <div class="screen-body">
    <div class="nav">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><path d="M15 19l-7-7 7-7"/></svg>
    </div>
    <div class="hero">
      <div class="coin btc">₿</div>
      <div class="amt">10.29 USDC</div>
      <div class="sub">開空 BTC-USDC</div>
    </div>
    <div class="divider"></div>
    <div class="rows">
      <div class="r"><span class="k">時間</span><span class="v">2026/08/07 10:05</span></div>
      <div class="r"><span class="k">數量</span><span class="v">0.00016 BTC</span></div>
      <div class="r"><span class="k">成交價格</span><span class="v">64,363</span></div>
      <div class="r"><span class="k">交易手續費</span><span class="v">-0.009597 USDC</span></div>
      <div class="r"><span class="k">淨盈虧</span><span class="v red">-0.009597 USDC</span></div>
    </div>
    <button class="explorer">在區塊鏈瀏覽器中查看</button>
  </div>
</div>
</body>
</html>
