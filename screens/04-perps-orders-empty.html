<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>永續 · 當前訂單</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 16px 10px;
    }
    .hdr h1 {
      font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 6px;
    }
    .hdr h1 .info {
      width: 16px; height: 16px; border-radius: 50%; border: 1.4px solid #8e8e93;
      color: #8e8e93; font-size: 11px; display: flex; align-items: center; justify-content: center;
      font-weight: 600;
    }
    .hdr .acts { display: flex; gap: 14px; align-items: center; }
    .asset-card {
      margin: 0 16px 12px; background: var(--bg-muted); border-radius: 16px;
      padding: 16px 16px 14px; position: relative;
    }
    .asset-card .lbl {
      font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 4px;
    }
    .asset-card .total {
      font-size: 32px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -0.5px;
    }
    .asset-card .avail { font-size: 13px; color: var(--text-2); }
    .asset-card .logos {
      position: absolute; top: 16px; right: 16px; width: 40px; height: 40px;
    }
    .asset-card .logos .usdc {
      width: 36px; height: 36px; border-radius: 50%; background: #2775ca;
      color: #fff; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .asset-card .logos .hl {
      position: absolute; right: -2px; bottom: -2px;
      width: 18px; height: 18px; border-radius: 50%; background: #00d1a0;
      border: 2px solid #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; color: #fff; font-weight: 700;
    }
    .asset-btns { display: flex; gap: 10px; margin-top: 14px; }
    .asset-btns button {
      flex: 1; height: 40px; border-radius: 999px; font-size: 15px; font-weight: 500;
    }
    .asset-btns .w { background: #e8e8ed; color: #000; }
    .asset-btns .a { background: #000; color: #fff; }
    .tabs {
      display: flex; gap: 22px; padding: 6px 16px 0; font-size: 15px; color: var(--text-2);
      border-bottom: 0.5px solid var(--border);
    }
    .tabs .on {
      color: #000; font-weight: 700; padding-bottom: 10px;
      border-bottom: 2.5px solid #000; margin-bottom: -0.5px;
    }
    .tabs span { padding-bottom: 10px; }
    .empty {
      display: flex; flex-direction: column; align-items: center;
      padding: 80px 24px 40px;
    }
    .empty .illu {
      width: 88px; height: 72px; margin-bottom: 16px;
      opacity: 0.55;
    }
    .empty .msg {
      font-size: 14px; color: var(--text-2); margin-bottom: 18px;
    }
    .empty .cta {
      height: 36px; padding: 0 22px; border-radius: 999px;
      background: #000; color: #fff; font-size: 14px; font-weight: 500;
    }
  </style>
</head>
<body class="capture">
